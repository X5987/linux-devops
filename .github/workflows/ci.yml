name: Node Angular Docker CI Yml

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - uses: actions/checkout@v3

      # 2️⃣ Installer Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Installer les dépendances
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build Angular (ou Node si projet Node seul)
      - name: Build Angular app
        run: npm run build

      # 5️⃣ Lancer Node pour vérifier
      - name: Run Node app
        run: node app/index.js

      # 6️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t mon_app_devops -f docker/Dockerfile .
